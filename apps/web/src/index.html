<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Chibi KTV</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0912">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
</head>
<body>
  <app-root>
    <!-- Shown until the app starts. The free server sleeps when nobody uses it and needs about a minute to wake. -->
    <div style="position:fixed;inset:0;display:grid;place-items:center;background:#0b0912;color:#f4effa;font:500 15px 'Be Vietnam Pro',system-ui,sans-serif;text-align:center;padding:24px">
      <div>
        <div style="font:28px Bungee,Impact,sans-serif;color:#ff3fa4;margin-bottom:10px">CHIBI <span style="color:#33e1ed">KTV</span></div>
        <div>Đang mở phòng hát…</div>
        <div style="margin-top:8px;color:#a89bbd;font-size:13px;opacity:0;animation:wake .4s 4s forwards">Máy chủ miễn phí đang thức dậy, có thể mất khoảng 1 phút. Cứ để trang mở nhé!</div>
      </div>
    </div>
    <style>@keyframes wake{to{opacity:1}}</style>
  </app-root>
</body>
</html>
