<main class="wrap">
  <header class="top">
    <div class="logo">CHIBI <span>KTV</span></div>
    <div class="me">
      <span>Xin chào, <b>{{ auth.user()?.displayName }}</b></span>
      <button class="btn-ghost" (click)="logout()">Đăng xuất</button>
    </div>
  </header>

  <div class="grid">
    <section class="panel box">
      <h2>Tạo phòng mới</h2>
      <div class="field">
        <label for="roomName">Tên phòng</label>
        <input id="roomName" [(ngModel)]="roomName" maxlength="40" />
      </div>
      <fieldset class="cap">
        <legend>Số ghế</legend>
        <label><input type="radio" name="cap" [value]="8" [(ngModel)]="capacity" /> 8 người</label>
        <label><input type="radio" name="cap" [value]="16" [(ngModel)]="capacity" /> 16 người</label>
      </fieldset>
      <button class="btn-pink" (click)="create()" [disabled]="busy()">Tạo phòng</button>
    </section>

    <section class="panel box">
      <h2>Vào phòng bạn bè</h2>
      <div class="field">
        <label for="code">Mã phòng (6 ký tự)</label>
        <input id="code" [(ngModel)]="code" maxlength="6" placeholder="VD: K7M2QX" (keyup.enter)="join()" />
      </div>
      <button class="btn-main" (click)="join()">Vào phòng</button>
    </section>
  </div>

  @if (error()) { <p class="error" role="alert">{{ error() }}</p> }
</main>
